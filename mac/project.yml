name: FlowDictate
options:
  bundleIdPrefix: com.johnmatveyev
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  # Parallel Mac App Store track — App Sandbox ON. DMG/notarize keeps using Release.
  ReleaseMAS: release
targets:
  FlowDictate:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: FlowDictate
        excludes:
          - "Info.plist"
          - "PrivacyInfo.xcprivacy"
      - path: Support/com.johnmatveyev.flowdictate.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    resources:
      # App Store privacy manifest (harmless in Developer ID builds; required for MAS).
      - path: FlowDictate/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnmatveyev.flowdictate
        # User-facing product + executable name (bundle id kept for Accessibility TCC).
        PRODUCT_NAME: Dictaste
        INFOPLIST_FILE: FlowDictate/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        # Universal by default; CI/scripts can build ARCHS=arm64 or x86_64 alone.
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: L85AF3V872
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        CURRENT_PROJECT_VERSION: 4
        MARKETING_VERSION: "0.1.4"
      configs:
        # Developer ID / notarized DMG path unchanged: sandbox OFF; scripts apply
        # scripts/Dictaste.entitlements + hardened runtime at codesign time.
        Debug:
          ENABLE_APP_SANDBOX: NO
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_APP_SANDBOX: NO
          ENABLE_HARDENED_RUNTIME: NO
        ReleaseMAS:
          ENABLE_APP_SANDBOX: YES
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_ENTITLEMENTS: scripts/Dictaste-MAS.entitlements
schemes:
  FlowDictate:
    build:
      targets:
        FlowDictate: all
    run:
      config: Release
  FlowDictate-MAS:
    build:
      targets:
        FlowDictate: all
    run:
      config: ReleaseMAS
    archive:
      config: ReleaseMAS
