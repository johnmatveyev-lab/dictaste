<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dictaste</title>
  <style>
    :root { --lime:#C8F542; --bg:rgba(10,10,11,0.92); --fg:#fff; --muted:#A1A1A6; }
    html, body { margin:0; background:transparent; overflow:hidden; font-family:Inter,system-ui,sans-serif; }
    .pill {
      margin: 8px;
      padding: 14px 18px;
      border-radius: 16px;
      background: var(--bg);
      border: 1px solid rgba(200,245,66,0.35);
      box-shadow: 0 12px 40px rgba(0,0,0,0.45), 0 0 24px rgba(200,245,66,0.12);
      color: var(--fg);
      -webkit-app-region: drag;
      user-select: none;
    }
    .row { display:flex; align-items:center; gap:12px; }
    .dot {
      width:12px; height:12px; border-radius:50%;
      background: var(--lime);
      box-shadow: 0 0 12px var(--lime);
      animation: pulse 1.1s ease-in-out infinite;
      flex-shrink:0;
    }
    .dot.idle { animation:none; background:#6B6B70; box-shadow:none; }
    @keyframes pulse { 0%,100%{ transform:scale(1); opacity:1 } 50%{ transform:scale(1.25); opacity:0.7 } }
    .label { font-size:13px; font-weight:600; letter-spacing:-0.01em; }
    .sub { font-size:11px; color:var(--muted); margin-top:2px; }
    .partial {
      margin-top:8px; font-size:12px; color:#E8E8EA; max-height:2.6em; overflow:hidden;
      line-height:1.3; opacity:0.9;
    }
    body.compact .pill { padding: 10px 14px; margin: 6px; }
    body.compact .partial { display: none; }
    body.compact .sub { font-size: 10px; }
  </style>
</head>
<body>
  <div class="pill">
    <div class="row">
      <div id="dot" class="dot idle"></div>
      <div>
        <div class="label" id="title">Dictaste</div>
        <div class="sub" id="sub">Ctrl+Shift+Space to dictate</div>
      </div>
    </div>
    <div class="partial" id="partial"></div>
  </div>
  <script>
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null;
    let finals = [];
    let interim = '';
    let sttMode = 'webspeech';
    let mediaRecorder = null;
    let mediaChunks = [];
    let mediaStream = null;
    let audioCtx = null;
    let silenceTimer = null;
    let maxDurationTimer = null;
    let silenceTimeoutMs = 0;
    let maxDictationMs = 0;
    let sessionActive = false;

    /** Soft start/stop cue (optional). */
    function playCue(kind) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const ctx = audioCtx;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = kind === 'start' ? 880 : 520;
        g.gain.value = 0.0001;
        o.connect(g);
        g.connect(ctx.destination);
        const t0 = ctx.currentTime;
        g.gain.exponentialRampToValueAtTime(0.05, t0 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + (kind === 'start' ? 0.08 : 0.12));
        o.start(t0);
        o.stop(t0 + 0.14);
      } catch (_) { /* ignore */ }
    }

    function countWords(text) {
      const s = String(text || '').trim();
      if (!s) return 0;
      return s.split(/\s+/).filter(Boolean).length;
    }

    function liveWordLabel(text, base) {
      const n = countWords(text);
      if (n <= 0) return base;
      return base + ' · ' + n + ' word' + (n === 1 ? '' : 's');
    }

    function setUI(listening, msg) {
      document.getElementById('dot').className = 'dot' + (listening ? '' : ' idle');
      document.getElementById('title').textContent = listening ? 'Listening…' : 'Dictaste';
      document.getElementById('sub').textContent = msg || (listening ? 'Speak now · hotkey to stop' : 'Ctrl+Shift+Space to dictate');
    }

    function clearSilenceTimer() {
      if (silenceTimer) {
        clearTimeout(silenceTimer);
        silenceTimer = null;
      }
    }

    function clearMaxDurationTimer() {
      if (maxDurationTimer) {
        clearTimeout(maxDurationTimer);
        maxDurationTimer = null;
      }
    }

    function armSilenceTimer() {
      clearSilenceTimer();
      if (!sessionActive || !silenceTimeoutMs || silenceTimeoutMs <= 0) return;
      silenceTimer = setTimeout(() => {
        silenceTimer = null;
        if (!sessionActive) return;
        document.getElementById('sub').textContent = 'Silence · stopping…';
        stop();
      }, silenceTimeoutMs);
    }

    function armMaxDurationTimer() {
      clearMaxDurationTimer();
      if (!sessionActive || !maxDictationMs || maxDictationMs <= 0) return;
      maxDurationTimer = setTimeout(() => {
        maxDurationTimer = null;
        if (!sessionActive) return;
        document.getElementById('sub').textContent = 'Max duration · stopping…';
        stop();
      }, maxDictationMs);
    }

    async function startMedia() {
      mediaChunks = [];
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : 'audio/webm';
      mediaRecorder = new MediaRecorder(mediaStream, { mimeType: mime });
      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size) mediaChunks.push(e.data);
      };
      mediaRecorder.start(250);
    }

    async function stopMedia() {
      return new Promise((resolve) => {
        if (!mediaRecorder || mediaRecorder.state === 'inactive') {
          cleanupStream();
          resolve(null);
          return;
        }
        mediaRecorder.onstop = async () => {
          const blob = new Blob(mediaChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          cleanupStream();
          const buf = await blob.arrayBuffer();
          const bytes = new Uint8Array(buf);
          let binary = '';
          for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
          resolve({ base64: btoa(binary), mime: blob.type || 'audio/webm' });
        };
        try { mediaRecorder.stop(); } catch (_) { resolve(null); }
      });
    }

    function cleanupStream() {
      try {
        (mediaStream?.getTracks() || []).forEach((t) => t.stop());
      } catch (_) {}
      mediaStream = null;
      mediaRecorder = null;
    }

    async function start(mode, lang) {
      sttMode = mode || 'webspeech';
      const sttLang = (lang || 'en-US').trim() || 'en-US';
      finals = [];
      interim = '';
      sessionActive = true;
      clearSilenceTimer();
      clearMaxDurationTimer();
      armMaxDurationTimer();
      document.getElementById('partial').textContent = '';

      // Always try MediaRecorder when using openai / whisper-cli
      if (sttMode === 'openai' || sttMode === 'whisper-cli') {
        try {
          await startMedia();
          setUI(
            true,
            (sttMode === 'openai' ? 'Whisper (OpenAI)…' : 'Whisper CLI…') +
              (silenceTimeoutMs ? ' · auto-stop ' + Math.round(silenceTimeoutMs / 1000) + 's' : '')
          );
          // No speech events — arm a longer fallback so user can speak then auto-stop
          armSilenceTimer();
          return;
        } catch (err) {
          sessionActive = false;
          setUI(false, 'Mic denied: ' + (err.message || err));
          window.dictaste.sessionComplete({ text: '' });
          return;
        }
      }

      // Web Speech path (+ optional parallel MediaRecorder for future)
      if (!SR) {
        try {
          await startMedia();
          setUI(true, 'Recording (no Web Speech)…');
          sttMode = 'openai'; // will fail without key; settings hint covers it
          armSilenceTimer();
          return;
        } catch (err) {
          sessionActive = false;
          setUI(false, 'Speech API unavailable — open Settings');
          window.dictaste.sessionComplete({ text: '' });
          return;
        }
      }
      try {
        if (rec) { try { rec.abort(); } catch (_) {} }
        rec = new SR();
        rec.continuous = true;
        rec.interimResults = true;
        rec.lang = sttLang;
        rec.onresult = (e) => {
          interim = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const t = e.results[i][0].transcript;
            if (e.results[i].isFinal) finals.push(t.trim());
            else interim += t;
          }
          const live = (finals.join(' ') + ' ' + interim).trim();
          document.getElementById('partial').textContent = live;
          const auto =
            silenceTimeoutMs > 0
              ? ' · silence ' + Math.round(silenceTimeoutMs / 1000) + 's'
              : '';
          document.getElementById('sub').textContent = liveWordLabel(
            live,
            'Web Speech · ' + sttLang + auto
          );
          armSilenceTimer();
        };
        rec.onerror = (e) => {
          document.getElementById('sub').textContent = 'Mic: ' + (e.error || 'error');
        };
        rec.start();
        const auto =
          silenceTimeoutMs > 0
            ? ' · silence ' + Math.round(silenceTimeoutMs / 1000) + 's'
            : '';
        setUI(true, 'Web Speech · ' + sttLang + auto);
        // Don't start silence clock until first speech — only arm after results
      } catch (err) {
        sessionActive = false;
        setUI(false, String(err.message || err));
        window.dictaste.sessionComplete({ text: '' });
      }
    }

    async function stop() {
      if (!sessionActive && !rec && !mediaRecorder) {
        // already stopping / idle
      }
      sessionActive = false;
      clearSilenceTimer();
      clearMaxDurationTimer();
      setUI(false, liveWordLabel((finals.join(' ') + ' ' + interim).trim(), 'Processing…'));
      try { if (rec) rec.stop(); } catch (_) {}
      await new Promise((r) => setTimeout(r, 280));
      let text = (finals.join(' ') + ' ' + interim).replace(/\s+/g, ' ').trim();
      let audioBase64 = null;
      let mime = null;
      if (mediaRecorder || mediaChunks.length) {
        const audio = await stopMedia();
        if (audio) {
          audioBase64 = audio.base64;
          mime = audio.mime;
        }
      }
      document.getElementById('partial').textContent = text || (audioBase64 ? 'Transcribing…' : '');
      const result = await window.dictaste.sessionComplete({ text, audioBase64, mime });
      if (result?.polished) {
        document.getElementById('partial').textContent = result.polished;
        setUI(false, 'Pasted · ready');
      } else if (result?.error) {
        setUI(false, result.error);
      } else {
        setUI(false, 'Ready');
      }
      setTimeout(() => setUI(false), 1600);
    }

    /** Discard in-progress capture — no polish/paste. */
    async function cancel() {
      sessionActive = false;
      clearSilenceTimer();
      clearMaxDurationTimer();
      setUI(false, 'Canceled');
      try { if (rec) rec.abort(); } catch (_) {
        try { if (rec) rec.stop(); } catch (_) {}
      }
      rec = null;
      finals = [];
      interim = '';
      document.getElementById('partial').textContent = '';
      if (mediaRecorder || mediaChunks.length || mediaStream) {
        try {
          if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        } catch (_) {}
        cleanupStream();
      }
      mediaChunks = [];
      await window.dictaste.sessionComplete({ text: '', discard: true, canceled: true });
      setTimeout(() => setUI(false), 900);
    }

    function applyCompact(on) {
      document.body.classList.toggle('compact', !!on);
    }

    window.dictaste.onDictateControl((msg) => {
      if (msg.action === 'style') {
        applyCompact(msg.hudCompact);
        return;
      }
      if (msg.action === 'start') {
        silenceTimeoutMs = Math.max(0, Number(msg.silenceTimeoutMs) || 0);
        maxDictationMs = Math.max(0, Number(msg.maxDictationMs) || 0);
        applyCompact(msg.hudCompact);
        if (msg.soundCues !== false) playCue('start');
        start(msg.sttMode, msg.sttLang);
      }
      if (msg.action === 'stop') {
        if (msg.soundCues !== false) playCue('stop');
        stop();
      }
      if (msg.action === 'cancel') {
        if (msg.soundCues !== false) playCue('stop');
        cancel();
      }
    });
    window.dictaste.onStatus((s) => {
      if (s.phase === 'transcribing') setUI(false, 'Transcribing…');
      if (s.phase === 'polishing') setUI(false, 'Polishing…');
      if (s.phase === 'idle' && s.last) {
        document.getElementById('partial').textContent = s.last;
      }
    });
  </script>
</body>
</html>
